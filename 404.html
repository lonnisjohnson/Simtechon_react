<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SimtechON</title>
    <script>
      // GitHub Pages HashRouter Fallback
      // Converts any direct 404 route path to HashRouter format so it loads seamlessly
      var path = window.location.pathname.replace(/^\/Simtechon_react/, '');
      if (!path.startsWith('/')) path = '/' + path;
      window.location.replace('/Simtechon_react/#' + path + window.location.search + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
